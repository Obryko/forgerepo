name: Bug
description: Report a reproducible defect in ForgeRepo.
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment

  - type: textarea
    id: impact
    attributes:
      label: Impact / regression
